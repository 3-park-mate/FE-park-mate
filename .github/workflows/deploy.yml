name: Deploy Frontend to EC2

on:
  push:
    branches:
      - dev
      - chore/cicd-init-setup

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker Image
        run: docker build -t frontend-service:latest .

      - name: Tag Docker Image
        run: docker tag frontend-service:latest ${{ steps.login-ecr.outputs.registry }}/frontend-service:latest

      - name: Push Docker Image to ECR
        run: docker push ${{ steps.login-ecr.outputs.registry }}/frontend-service:latest

      - name: Copy docker-compose-frontend.yml to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "docker-compose-frontend.yml"
          target: "~/"

      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            # .env 파일을 컨테이너가 접근 가능한 위치에 생성
            mkdir -p ~/config/frontend
            cat > ~/config/frontend/.env << 'EOL'
            ${{ secrets.ENV }}
            EOL
  
            docker pull ${{ steps.login-ecr.outputs.registry }}/frontend-service:latest
            docker-compose -f docker-compose-frontend.yml down
            docker-compose -f docker-compose-frontend.yml up -d
            docker image prune -f