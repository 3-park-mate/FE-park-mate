name: Deploy Frontend to EC2

on:
  push:
    branches:
      - dev
      - chore/cicd-init-setup

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Docker image
        run: |
          docker build -t frontend-service .
          docker tag frontend-service:latest 090188239653.dkr.ecr.ap-northeast-2.amazonaws.com/frontend-service:latest
          docker push 090188239653.dkr.ecr.ap-northeast-2.amazonaws.com/frontend-service:latest

      - name: SSH and Deploy on EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull 090188239653.dkr.ecr.ap-northeast-2.amazonaws.com/frontend-service:latest
            docker-compose -f docker-compose.frontend.yml up -d